name: Production release

# Run manually with `eas workflow:run production-release.yml` (or `just
# mobile release`) from apps/omiro, or via the EAS dashboard.
on:
  workflow_dispatch: {}

# The submit/update job runners are not covered by eas.json's build-profile
# `node` field, so without this they fall back to the image default (Node
# 22.23.1) and pnpm's engine-strict check rejects root devDependencies that
# require Node >= 24 (portless). Keep this in sync with .nvmrc / .mise.toml /
# eas.json.
defaults:
  tools:
    node: 24.18.0

jobs:
  approve:
    name: Approve production release
    type: require-approval

  build_ios:
    name: Build iOS (production)
    type: build
    needs: [approve]
    params:
      platform: ios
      profile: production

  # Fails the run before Apple ever sees the binary if the build resolved to
  # the wrong app identity. This is the check that would have caught the
  # incident where a locally-run "production" build silently picked up the
  # dev bundle identifier (com.pontistudios.hakumi.dev) via an ambient
  # APP_ENV in .env.development.local and got rejected by App Store Connect
  # with "No suitable application records were found."
  guard_identity:
    name: Verify app identity before submitting
    type: custom
    needs: [build_ios]
    steps:
      - name: Assert production bundle identifier
        run: |
          expected="com.pontistudios.hakumi"
          actual="${{ needs.build_ios.outputs.app_identifier }}"
          if [ "$actual" != "$expected" ]; then
            echo "Refusing to submit: build resolved to app identifier \"$actual\", expected \"$expected\"." >&2
            exit 1
          fi
          echo "App identifier OK: $actual"
      - name: Assert store distribution
        run: |
          expected="store"
          actual="${{ needs.build_ios.outputs.distribution }}"
          if [ "$actual" != "$expected" ]; then
            echo "Refusing to submit: build distribution is \"$actual\", expected \"$expected\"." >&2
            exit 1
          fi
          echo "Distribution OK: $actual"

  submit_ios:
    name: Distribute to TestFlight
    type: testflight
    needs: [guard_identity]
    environment: production
    env:
      APP_ENV: production
      # TODO: remove once the submission-config resolution failure below is
      # root-caused — this only exists to surface eas-cli's swallowed error.
      EXPO_DEBUG: "1"
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
      changelog: ${{ github.commit_message || 'Production release' }}
      wait_processing_timeout_seconds: 1800
    hooks:
      # The submit job's runner ships a preinstalled pnpm that doesn't match
      # this repo's pinned packageManager version, and pnpm-workspace.yaml's
      # pmOnFail: error (intentional, paired with the repo's other
      # supply-chain hardening settings) makes that a hard failure rather
      # than a silent auto-download. `corepack prepare --activate` alone is
      # not enough here: corepack isn't enabled on this runner, so `pnpm`
      # resolves straight to the preinstalled binary regardless of what was
      # prepared — `corepack enable pnpm` first, then activate the pinned
      # version, before EAS's automatic install step runs, instead of
      # loosening that policy repo-wide.
      before_install_node_modules:
        - run: corepack enable pnpm && corepack prepare pnpm@11.23.0 --activate
