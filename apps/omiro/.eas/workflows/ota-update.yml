name: OTA update

# Publishes a JS-only over-the-air update to the production channel. Run
# manually with `eas workflow:run .eas/workflows/ota-update.yml -F
# message="..."` (or `just mobile update "..."`) from apps/omiro, or via the
# EAS dashboard. Only reaches installs already running a native build that
# includes expo-updates with a matching fingerprint runtimeVersion — ship a
# store build first.
on:
  workflow_dispatch:
    inputs:
      message:
        type: string
        required: true
        description: 'Update message shown in the EAS dashboard'

# The submit/update job runners are not covered by eas.json's build-profile
# `node` field, so without this they fall back to the image default (Node
# 22.23.1) and pnpm's engine-strict check rejects root devDependencies that
# require Node >= 24 (portless). Keep this in sync with .nvmrc / .mise.toml /
# eas.json.
defaults:
  tools:
    node: 24.18.0

jobs:
  validate_source:
    name: Validate production OTA source
    runs_on: linux-medium
    env:
      APP_ENV: production
      NODE_ENV: production
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: Run Omiro checks
        run: |
          set -euo pipefail
          pnpm run format:check
          pnpm run lint
          pnpm run typecheck
          pnpm run test
          pnpm run export:embed:ios
    hooks:
      before_install_node_modules:
        - run: corepack enable pnpm && corepack prepare pnpm@11.23.0 --activate

  approve:
    name: Approve production OTA update
    type: require-approval
    needs: [validate_source]

  publish_update:
    name: Publish to production channel
    type: update
    needs: [approve]
    environment: production
    env:
      APP_ENV: production
    params:
      # Target the channel consumed by the production store build directly.
      # Manually-run workflows do not inherit a Git branch for EAS Update.
      platform: ios
      channel: production
      message: ${{ inputs.message }}
    hooks:
      # See production-release.yml's submit_ios job for why this is needed:
      # the runner's preinstalled pnpm doesn't match the repo's pinned
      # version, and pnpm-workspace.yaml's pmOnFail: error makes that fail
      # the automatic dependency install instead of warning. `corepack
      # enable` first, since corepack isn't enabled by default on this
      # runner and `prepare --activate` alone doesn't intercept `pnpm`
      # calls without it.
      before_install_node_modules:
        - run: corepack enable pnpm && corepack prepare pnpm@11.23.0 --activate
