<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f3ee" />
    <title>Omiro · Auth design directions</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="explorer">
      <header class="explorer-header">
        <div>
          <p class="eyebrow">OMIRO · AUTH STUDY</p>
          <h1>Three quieter ways in.</h1>
        </div>
        <p class="explorer-note">Use the picker or ← → to explore. Each screen is interactive.</p>
      </header>
      <section id="stage" class="stage" aria-label="Selected auth concept and screen preview"></section>
      <nav class="proto-picker" aria-label="Prototype variants">
        <span class="proto-picker-highlight" aria-hidden="true"></span>
        <button class="proto-picker-item" data-active aria-current="true">Atelier</button>
        <button class="proto-picker-item">Nocturne</button>
        <button class="proto-picker-item">Gallery</button>
        <span class="proto-picker-divider" aria-hidden="true"></span>
        <button class="proto-picker-item proto-picker-replay" aria-label="Replay animation (R)">↻</button>
      </nav>
    </main>
    <script src="prototype.js"></script>
  </body>
</html>
