appId: com.pontistudios.hakumi.dev
---
# Exercises the floating Time extraction actions and native bottom sheet.
- runFlow: startup.yaml

- openLink: hakumi-dev://time
- extendedWaitUntil:
    visible:
      id: time-floating-add
    timeout: 10000
- assertVisible:
    id: time-floating-mic
- takeScreenshot: time-floating-actions

# Text mode opens as a native bottom sheet with the field ready for input.
- tapOn:
    id: time-floating-add
- assertVisible:
    id: time-extraction-sheet
- assertVisible:
    id: time-composer-input
- assertVisible:
    id: time-composer-mic-button
- assertVisible:
    id: time-composer-submit
- takeScreenshot: time-extraction-empty

- tapOn:
    id: time-composer-input
- takeScreenshot: time-extraction-focused-empty

- inputText: Lunch with Sam tomorrow at noon
- assertVisible:
    id: time-composer-submit
- takeScreenshot: time-extraction-typing

- eraseText: 60
- tapOn:
    text: What do you want to plan?
- assertVisible:
    id: time-composer-input
- takeScreenshot: time-extraction-idle-after-clear

# Dismiss the sheet and open voice mode from the floating microphone.
- swipe:
    start: '50%, 25%'
    end: '50%, 95%'
- assertVisible:
    id: time-floating-mic
- tapOn:
    id: time-floating-mic
- assertVisible:
    id: composer-cancel-recording-button
- assertVisible:
    id: composer-stop-recording-button
- takeScreenshot: time-extraction-voice
- tapOn:
    id: composer-cancel-recording-button

# Actual model processing remains optional in this deterministic UI flow.
- inputText: Lunch with Sam tomorrow at noon
- tapOn:
    id: time-composer-submit
- extendedWaitUntil:
    visible:
      id: time-result
    timeout: 20000
    optional: true
- takeScreenshot: time-extraction-after-submit
- runFlow:
    when:
      visible:
        id: time-draft-cancel
    commands:
      - tapOn:
          id: time-draft-cancel
- runFlow:
    when:
      visible:
        id: time-event-choice-cancel
    commands:
      - tapOn:
          id: time-event-choice-cancel
- runFlow:
    when:
      visible:
        id: time-availability-cancel
    commands:
      - tapOn:
          id: time-availability-cancel

- openLink: hakumi-dev://
- assertVisible:
    id: inbox-composer-input
