appId: com.pontistudios.hakumi.dev
---
# Navigates from a tab to Settings via the header's profile button, then back.
# Asserted by settings-usage-section's testID rather than the screen's title.
#
# Settings is presented as an iOS form sheet (presentation: 'formSheet' in
# app/(protected)/_layout.tsx), not a stack push -- there's no BackButton or
# header "Inbox" button to tap. It dismisses like any native sheet: swipe
# down. (There's also no in-screen close button to fall back on.)
- runFlow: startup.yaml
- tapOn:
    id: settings-button
- assertVisible:
    id: settings-usage-section
- swipe:
    direction: DOWN
    startPoint: '50%,10%'
    endPoint: '50%,90%'
- assertVisible:
    id: inbox-composer-input
