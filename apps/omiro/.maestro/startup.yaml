appId: com.pontistudios.hakumi.dev
---
# Startup helper that waits for the app to be ready after launch.
# Handles both cold starts (auth/boot screens) and warm launches
# where the inbox is already visible.
- launchApp
# Wait for the inbox to be interactive. The app may briefly show a
# booting indicator before navigating to the inbox or auth screen.
- assertVisible:
    id: protected-bootstrap
    optional: true
- assertVisible:
    id: auth-screen
    optional: true
# resolveAuthRedirect (services/navigation/auth-route-guard.ts) renders this
# fallback while it decides where (protected) should send you. On a slow
# cold boot it can outlast a short optional assertVisible check entirely, so
# wait for it to actually clear rather than just glancing at it once.
- extendedWaitUntil:
    notVisible:
      id: protected-route-fallback
    timeout: 45000
    optional: true
# The app persists a "resume target" (writeResumeTarget in
# ChatScreen.tsx, and the equivalent for notes) and relaunches straight
# into the last-viewed chat or note instead of the inbox. The target is
# cleared when the detail screen unmounts (leaving the chat), so this only
# happens when the app was killed while still on the detail screen. This
# isn't hypothetical: chat-send-message.yaml, notes-create.yaml (and manual
# exploration) can each leave their detail screen as the last route, so a
# later flow's launchApp lands there, not on the inbox. Wait (boot can take
# a few seconds) to see if that's where we landed, then back out explicitly
# rather than assuming launch always reaches inbox-composer-input.
- extendedWaitUntil:
    visible:
      id: chat-composer-input
    timeout: 20000
    optional: true
- extendedWaitUntil:
    visible:
      id: note-title-input
    timeout: 5000
    optional: true
# Both ChatScreen and the note screen show the native back
# chevron (accessibility label BackButton) only when canGoBack is true; when opened
# via replace (no back stack), each renders its own "Inbox" toolbar button
# instead with no testID. Try id, then text, then Inbox so this works
# regardless of how the screen was reached: the chevron has been observed
# with a label but no resource-id, where an id-only tap silently no-ops.
# Text taps are safe here — these are detail screens, not modals, so the
# unfocused-subtree merge that makes text taps risky does not apply).
#
# Wrapped in `when` (not a bare optional tapOn): a one-shot optional tap can
# fire before the screen has settled from the extendedWaitUntil above and
# silently no-op, leaving us stuck on the detail screen for the rest of the
# flow. `when` gives Maestro's own polling/retry a chance to find the button.
- runFlow:
    when:
      visible:
        id: chat-composer-input
    commands:
      - tapOn:
          id: BackButton
          optional: true
      - tapOn:
          text: BackButton
          optional: true
      - tapOn:
          text: Inbox
          optional: true
- runFlow:
    when:
      visible:
        id: note-title-input
    commands:
      - tapOn:
          id: BackButton
          optional: true
      - tapOn:
          text: BackButton
          optional: true
      - tapOn:
          text: Inbox
          optional: true
# Same resume-target problem as chat/notes above, but for a calendar event
# edit screen pushed from the Time route (getTimeBlockRoute in
# TimeScreen.tsx). Its BackButton goes to the Time root, not the inbox --
# see the next step for getting from there back to the inbox.
- extendedWaitUntil:
    visible:
      id: time-block-editor
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible:
        id: time-block-editor
    commands:
      - tapOn:
          id: BackButton
          optional: true
      - tapOn:
          text: BackButton
          optional: true
# If we're on the Time root (navigation-menu visible, but not yet on
# the inbox), use the nav drawer to get to "All" -- the same menu the
# time-block-editor back step above can land on. Match by icon id
# (tray.full.fill), not text: "All" also matches the inbox screen's own
# header title once navigation lands, and text tap can race that.
- runFlow:
    when:
      visible:
        id: navigation-menu
      notVisible:
        id: inbox-composer-input
    commands:
      - tapOn:
          id: navigation-menu
      # Wait for the menu's open animation BEFORE tapping an item, not
      # after -- see the identical comment in time-composer-interactions.yaml
      # for why (tapping immediately raced the item settling into position).
      - waitForAnimationToEnd:
          timeout: 2000
      - tapOn:
          id: tray.full.fill
- extendedWaitUntil:
    visible:
      id: inbox-composer-input
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: navigation-menu
    timeout: 15000
