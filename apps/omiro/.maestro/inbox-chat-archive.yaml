appId: com.pontistudios.hakumi.dev
---
# Creates a throwaway chat from the inbox composer (self-contained, no seed
# data assumption), archives it via the row's long-press menu, and confirms
# it disappears from the inbox list.
#
# Archive/delete live behind a native long-press Alert.alert on the row
# (InboxStreamItem.tsx handleLongPress), titled with the item's own text --
# there's no dedicated "actions" button/testID and no swipe action anymore.
# Archive has no second confirmation (handleArchive fires immediately),
# unlike delete (see notes-delete.yaml). The extendedWaitUntil before tapping
# "Archive chat" isn't cosmetic -- tapping immediately after longPressOn
# races the native Alert's open animation and misses the button.
- runFlow: startup.yaml
- tapOn:
    id: inbox-composer-input
- inputText: Maestro archive test chat
- tapOn:
    id: composer-kind-chat
- assertVisible:
    id: composer-submit-chat
- tapOn:
    id: composer-submit-chat
- assertVisible:
    id: chat-composer-input
- tapOn:
    id: chat-back-button
    optional: true
- tapOn:
    text: Inbox
    optional: true
- assertVisible: ".*Maestro archive test chat.*"
- runFlow:
    file: archive-chat.yaml
    env:
      CHAT_TITLE: Maestro archive test chat
- assertVisible:
    id: inbox-composer-input
