appId: com.pontistudios.hakumi.dev
---
# Starts a chat from the inbox composer. Typing text, selecting the
# Conversation kind, and tapping the submit button creates a chat and
# navigates to the chat detail screen.
#
# There's no standalone "start chat" secondary-action button anymore --
# ComposerToolbar dropped it when the Conversation/Document row was folded
# into the composer's own bottom toolbar as an icon toggle (see
# ComposerKindToggle.tsx). Selecting "chat" is what makes ComposerToolbar's
# submit button become composer-submit-chat (composerSubmission.helpers.ts);
# tapping composer-kind-chat explicitly rather than relying on
# inferComposerEntryKind's default keeps this deterministic regardless of
# what the typed text would otherwise infer to.
- runFlow: startup.yaml
- tapOn:
    id: inbox-composer-input
- inputText: Native first smoke chat
- tapOn:
    id: composer-kind-chat
- assertVisible:
    id: composer-submit-chat
- tapOn:
    id: composer-submit-chat
- assertVisible: ".*Native first smoke chat.*"
- assertVisible:
    id: chat-composer-input
- tapOn:
    id: chat-back-button
    optional: true
- tapOn:
    text: Inbox
    optional: true
- assertVisible:
    id: inbox-composer-input
# Archived afterward (swipe -> archive, no confirmation --
# see inbox-chat-archive.yaml) so repeated runs don't accumulate chats. Safe
# to match by this exact title since it's a custom, non-default title, not
# the generic "New conversation" default other chats can share.
#
- runFlow:
    file: archive-chat.yaml
    env:
      CHAT_TITLE: Native first smoke chat
- assertVisible:
    id: inbox-composer-input
