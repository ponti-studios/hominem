appId: com.pontistudios.hakumi.dev
---
# Event rows hand off to Apple's native event editor (the fixture gateway
# stands in for EventKitUI and reports "saved"); the app keeps no event detail
# screen of its own, so the stream is still there afterwards.
- runFlow: ../subflows/reset-to-home.yaml
- openLink: hakumi-dev:///time
# The fixture event is two days out; the stream shows one day at a time.
- tapOn:
    id: time-day-2
- extendedWaitUntil:
    visible:
      id: time-item-event-time-fixture-editable
    timeout: 10000
- tapOn:
    id: time-item-event-time-fixture-editable
- extendedWaitUntil:
    visible:
      id: time-stream
    timeout: 10000
