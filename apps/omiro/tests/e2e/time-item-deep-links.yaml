appId: com.pontistudios.hakumi.dev
---
# An event deep link presents Apple's native editor (fixture: "saved") and then
# replaces itself with the Time stream.
- runFlow: ../subflows/reset-to-home.yaml
- openLink: hakumi-dev://time/event/time-fixture-editable
- extendedWaitUntil:
    visible:
      id: time-stream
    timeout: 10000
