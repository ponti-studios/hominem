appId: com.pontistudios.hakumi.dev
---
- runFlow: ../subflows/reset-to-home.yaml
- assertVisible:
    id: stream-screen
- tapOn:
    id: home-time-button
- assertVisible:
    id: time-screen
- assertVisible:
    id: time-stream
- tapOn:
    id: time-unscheduled-button
- waitForAnimationToEnd
- assertVisible:
    id: unscheduled-tasks-screen
- takeScreenshot: /tmp/omiro-time-unscheduled-tab
