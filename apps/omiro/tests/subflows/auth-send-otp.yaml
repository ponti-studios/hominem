appId: com.pontistudios.hakumi.dev
---
# Phase 1 of the two-phase E2E login (see maestro-auth.sh wrapper).
# Enters the email and requests an OTP, landing on the OTP screen. Does NOT
# type the code: the OTP is generated server-side on send, so the wrapper
# reads it from the scripted mailbox only after this flow completes, then
# runs auth-verify-otp.yaml with it injected via `-e OTP=...`.
#
# No-op when the app is already authenticated (auth screen not visible).
#
# This runs as its own `maestro test` process, separate from
# reset-app-state.yaml's \u2014 the simulator can briefly drop to the home screen
# between the two invocations (XCTest driver teardown/restart), so a single
# instantaneous visibility check for auth-email-input can false-negative and
# silently skip the whole flow. Bring the app forward and retry the check the
# same way reset-app-state.yaml does, rather than checking once.
- launchApp
- repeat:
    times: 10
    while:
      notVisible:
        id: auth-email-input
    commands:
      - runFlow:
          when:
            visible: 'Apple[\s\u00A0]+Account Verification'
          commands:
            - tapOn: 'Not Now'
      - extendedWaitUntil:
          visible:
            id: auth-email-input
          optional: true
          timeout: 5000
- runFlow:
    when:
      visible:
        id: auth-email-input
    commands:
      - tapOn:
          id: auth-email-input
      - inputText: ${E2E_USER_EMAIL}
      - tapOn:
          id: auth-send-otp
      - assertVisible:
          id: auth-otp-input-container
