appId: com.pontistudios.hakumi.dev
---
- stopApp
- launchApp
- openLink: hakumi-dev:///chat
- waitForAnimationToEnd:
    timeout: 10000
# The chat screen's actual React Native testID is `chat-back-button`; the
# accessibility label `BackButton` is not its XCTest identifier.
- tapOn:
    id: 'chat-back-button'
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
