appId: com.pontistudios.hakumi.dev
---
- stopApp
- launchApp
- openLink: hakumi-dev:///chat
- waitForAnimationToEnd:
    timeout: 10000
# BackButton is a resource-id (testID), not text: tap by id. Tapping by text
# mis-resolves when iOS merges unfocused subtrees into one node (see
# apps/omiro/AGENTS.md).
- tapOn:
    id: 'BackButton'
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: 'BackButton'
    optional: true
- waitForAnimationToEnd:
    timeout: 1500
