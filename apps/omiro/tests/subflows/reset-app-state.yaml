appId: com.pontistudios.hakumi.dev
---
# Programmatic clean bootstrap for the two-phase login (see maestro-auth.sh).
# Relaunches the app with the keychain cleared so SecureStore's session token
# is gone and the app lands signed out on the auth screen.
#
# The wrapper wipes Documents/mmkv (the persisted react-query cache in
# app-storage plus the resume-target local store) via simctl BEFORE this
# flow, so a stale, possibly wrong-account cache and a dead resume target
# can't survive into the new session — that combination is what strands a
# fresh login on a 404'd chat detail instead of the inbox.
- stopApp
- clearKeychain
# Start the app through the dev-client link rather than `launchApp`: launching first makes the dev
# client load its last server, and the link then reloads it while views are mounting, which crashes
# it ("The app context has been lost"). The link also covers a freshly installed dev client, which
# opens on its launcher.
- openLink: 'exp+hakumi://expo-development-client/?url={{METRO_URL}}&disableOnboarding=1'
# The simulator's iCloud account can throw an "Apple Account Verification"
# system alert whenever the app's keychain is cleared. It covers the screen,
# so dismiss it between auth-screen waits rather than allowing a stale session
# fallback to hide a failed login.
- repeat:
    times: 10
    while:
      notVisible:
        id: auth-email-input
    commands:
      - runFlow:
          when:
            visible: 'Apple[\s\u00A0]+Account Verification'
          commands:
            - tapOn: 'Not Now'
      - extendedWaitUntil:
          visible:
            id: auth-email-input
          optional: true
          timeout: 5000
- assertVisible:
    id: auth-email-input
