appId: com.pontistudios.hakumi.dev
---
# Flow: Inbox note swipe-to-delete
# Swipes the note row open and captures the confirmation Alert for the
# revealed Delete action.

- runFlow: ../subflows/reset-to-home.yaml
- tapOn: 'Notes'
- waitForAnimationToEnd:
    timeout: 500
- assertVisible:
    id: 'inbox-item-note'
- swipe:
    from:
      id: 'inbox-item-note'
      index: 0
    direction: LEFT
- tapOn:
    id: 'inbox-item-note-delete'
- waitForAnimationToEnd:
    timeout: 1000
- assertVisible: 'Delete'
- takeScreenshot: omiro_inbox_note_actions_menu
