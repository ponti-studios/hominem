appId: com.pontistudios.hakumi.dev
---
# Flow: Chat back returns to All
# Creates a chat from the All composer, taps the chat detail back control, and
# verifies users land on All instead of another history entry.

- runFlow: ../subflows/open-dev-home.yaml
- assertVisible:
    id: 'inbox-composer-input'
- tapOn:
    point: '42%, 11%'
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    id: 'inbox-composer-input'
- inputText: 'Back navigation probe'
- waitForAnimationToEnd:
    timeout: 1000
- assertVisible:
    id: 'composer-submit-chat'
- tapOn:
    id: 'composer-submit-chat'
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: 'Back navigation probe'
- assertVisible:
    id: 'chat-composer-input'
- tapOn:
    text: 'BackButton'
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: 'inbox-composer-input'
- takeScreenshot: omiro_chat_back_to_all
