appId: com.pontistudios.hakumi.dev
---
# Flow: Note title edit
# Regresses the crash where focusing/editing the note title caused UIKit to
# abort while reloading the editor keyboard accessory view.

- runFlow: ../subflows/open-dev-home.yaml
- assertVisible:
    id: 'inbox-composer-input'
# The app opens on the Chat tab; notes are listed on the Notes tab.
- tapOn: 'Notes'
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: 'inbox-item-note'
- tapOn:
    id: 'inbox-item-note'
    index: 0
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible:
    id: 'note-title-input'
- tapOn:
    id: 'note-title-input'
- eraseText: 100
- inputText: 'Edited note title from Maestro'
- waitForAnimationToEnd:
    timeout: 1000
- assertVisible:
    id: 'note-title-input'
- takeScreenshot: omiro_note_title_edit
