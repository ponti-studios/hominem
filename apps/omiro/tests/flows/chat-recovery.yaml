appId: com.pontistudios.hakumi.dev
---
# Omiro evidence: failure, retry, cancellation, replay, reload, and
# authorization boundaries. Use a unique MAESTRO_RUN_ID per run when driving
# RECOVER-01 through a scripted API provider.

- runFlow: ../subflows/reset-to-home.yaml
- openLink: 'hakumi-dev:///new-chat'
- waitForAnimationToEnd:
    timeout: 4000
- assertVisible:
    id: 'new-chat-composer-input'
- tapOn:
    id: 'new-chat-composer-input'
- eraseText: 100
- inputText: 'RECOVER-01 setup chat'
- pressKey: BACK
- tapOn:
    id: 'new-chat-submit'
- waitForAnimationToEnd:
    timeout: 8000
- assertVisible:
    id: 'chat-composer-input'

# RECOVER-01: provider failure -> friendly recovery -> retry. The current
# Omiro copy is captured by the screenshots; durable failed/retry run
# correlation is checked separately through the API inspector.
- tapOn:
    id: 'chat-composer-input'
- eraseText: 100
- inputText: 'RECOVER-01-OMIRO-SCRIPT:PROVIDER_FAIL-${MAESTRO_RUN_ID || "local"}'
- tapOn:
    id: 'composer-submit-message'
- pressKey: BACK
- waitForAnimationToEnd:
    timeout: 8000
- assertVisible:
    id: 'chat-activity'
- takeScreenshot: /tmp/omiro-recover01-failure
- assertVisible: 'Retry reply'
- tapOn: 'Retry reply'
- waitForAnimationToEnd:
    timeout: 8000
- assertVisible:
    id: 'chat-composer-input'
- takeScreenshot: /tmp/omiro-recover01-retry-complete

# RECOVER-02/RECOVER-03: stop before execution and while a controlled stream
# is active.
- tapOn:
    id: 'chat-composer-input'
- eraseText: 100
- inputText: 'SCRIPT:CANCEL_BEFORE __MAESTRO_SLOW_STREAM__'
- tapOn:
    id: 'composer-submit-message'
- pressKey: BACK
- assertVisible:
    id: 'chat-generation-stop'
- tapOn: 'Stop reply'
- assertVisible: 'Stopping reply'
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: 'Reply stopped'
- takeScreenshot: /tmp/omiro-recover02-cancel-before

- tapOn:
    id: 'chat-composer-input'
- eraseText: 100
- inputText: 'SCRIPT:STREAM __MAESTRO_SLOW_STREAM__'
- tapOn:
    id: 'composer-submit-message'
- pressKey: BACK
- assertVisible:
    id: 'chat-generation-stop'
- takeScreenshot: /tmp/omiro-recover03-streaming
- tapOn: 'Stop reply'
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: 'Reply stopped'
- takeScreenshot: /tmp/omiro-recover03-cancelled

# RECOVER-04/RECOVER-05: relaunch during a controlled stream and verify the
# durable chat remains available. Maestro cannot sever only one HTTP stream,
# so the exact transport-disconnect/replay-overlap assertion remains
# API/testkit evidence.
- tapOn:
    id: 'chat-composer-input'
- eraseText: 100
- inputText: 'SCRIPT:REPLAY __MAESTRO_SLOW_STREAM__'
- tapOn:
    id: 'composer-submit-message'
- pressKey: BACK
- stopApp
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: 'chat-composer-input'
- takeScreenshot: /tmp/omiro-recover04-recover05-reconnect-replay

# RECOVER-06/LAUNCH-02: confirmation/reload and active-generation reload.
- tapOn:
    id: 'chat-composer-input'
- eraseText: 100
- inputText: 'RECOVER-06-OMIRO-CONFIRM reload confirmation check'
- tapOn:
    id: 'composer-submit-message'
- waitForAnimationToEnd:
    timeout: 8000
- assertVisible: 'Approve create_collection'
- stopApp
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible: 'Approve create_collection'
- takeScreenshot: /tmp/omiro-recover06-confirmation-reload
- tapOn: 'Reject create_collection'
- waitForAnimationToEnd:
    timeout: 8000

- tapOn:
    id: 'chat-composer-input'
- eraseText: 100
- inputText: 'SCRIPT:ACTIVE_RELOAD __MAESTRO_SLOW_STREAM__'
- tapOn:
    id: 'composer-submit-message'
- pressKey: BACK
- waitForAnimationToEnd:
    timeout: 1000
- stopApp
- launchApp
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: 'chat-composer-input'
- takeScreenshot: /tmp/omiro-launch02-active-reload

# LAUNCH-01/LAUNCH-04 are recorded as explicit harness checkpoints. A second
# signed-in account and API-side ownership probes cannot be created by this
# UI-only flow. Do not claim authorization isolation from this file alone.
- takeScreenshot: /tmp/omiro-launch01-fresh-launch-checkpoint
- takeScreenshot: /tmp/omiro-launch04-authorization-checkpoint
