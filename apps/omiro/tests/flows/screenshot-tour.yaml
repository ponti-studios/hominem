appId: com.pontistudios.hakumi.dev
---
# Screenshot tour — captures every major app state.
# Assumes the app is installed and the user is signed in.

# ── 1. Home / Inbox ──────────────────────────────────────────────────────────
- runFlow: ../subflows/reset-to-home.yaml
- assertVisible: 'Chat'
- takeScreenshot: omiro_screen_01_inbox

# ── 2. Inbox – search focused ────────────────────────────────────────────────
- tapOn: 'Search'
- waitForAnimationToEnd:
    timeout: 1000
- takeScreenshot: omiro_screen_02_search_focused
# Dismiss by tapping the list area
- tapOn:
    point: '50%, 50%'
- waitForAnimationToEnd:
    timeout: 500

# ── 3. Composer – inbox mode (text entered) ───────────────────────────────────
- tapOn:
    id: 'inbox-composer-input'
- inputText: 'Some example note content for the screenshot tour'
- waitForAnimationToEnd:
    timeout: 500
- takeScreenshot: omiro_screen_03_composer_feed_text
# Clear and dismiss keyboard
- eraseText: 100
- pressKey: Escape

# ── 4. Settings ───────────────────────────────────────────────────────────────
# Header search stays open after the tour above and hides the native header items, so close it first.
- runFlow:
    when:
      visible: 'Close'
    commands:
      - tapOn: 'Close'
- waitForAnimationToEnd:
    timeout: 800
- tapOn: 'Settings'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: omiro_screen_04_settings

# ── 5. Archived chats (from Settings) ────────────────────────────────────────
- swipe:
    direction: UP
    duration: 600
- waitForAnimationToEnd:
    timeout: 800
- tapOn:
    id: 'settings-archived-chats'
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: omiro_screen_05_archived_chats
# Settings is a form sheet with no visible back button here; dismiss it with a downward drag.
- swipe:
    start: '50%,12%'
    end: '50%,95%'
    duration: 500
- waitForAnimationToEnd:
    timeout: 1000
- swipe:
    start: '50%,12%'
    end: '50%,95%'
    duration: 500
- waitForAnimationToEnd:
    timeout: 1000

# ── 6. Note detail ────────────────────────────────────────────────────────────
# Notes are listed on the Notes tab; the chat list (next section) is on the Chat tab.
- tapOn:
    point: '35%,11%'
- waitForAnimationToEnd:
    timeout: 800
- tapOn:
    point: '50%,94%'
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: 'inbox-item-note'
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: omiro_screen_06_note_detail
# Glass close button, top-left corner of the detail sheet.
- tapOn:
    point: '10%,10%'
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    point: '28%,94%'
- waitForAnimationToEnd:
    timeout: 1500

# ── 7. Chat detail ────────────────────────────────────────────────────────────
- tapOn:
    id: 'inbox-item-chat'
- waitForAnimationToEnd:
    timeout: 2500
- takeScreenshot: omiro_screen_07_chat_detail
# Glass close button, top-left corner of the detail sheet.
- tapOn:
    point: '10%,10%'
- waitForAnimationToEnd:
    timeout: 1000
