appId: com.pontistudios.hakumi.dev
---
# Omiro evidence:
#   - loading/error (UI-01/UI-02)
#   - message actions (UI-03/UI-04)
#   - viewport (UI-05)
#   - keyboard and accessibility (UI-06)

- runFlow: ../subflows/reset-to-home.yaml
- tapOn:
    id: 'inbox-item-chat-open'
    index: 0
- waitForAnimationToEnd:
    timeout: 4000
- assertVisible:
    id: 'chat-composer-input'

# UI-01: the list and chat entry are loaded without an empty-state crash.
- assertVisible:
    id: 'chat-message-list'
- takeScreenshot: /tmp/omiro-ui01-loaded

# UI-02: explicit missing-chat route checkpoint. The app should show the
# recovery screen rather than render a composer for an unowned chat.
- openLink: 'hakumi-dev:///chats/00000000-0000-0000-0000-000000000000'
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: 'chat-entry-error'
- takeScreenshot: /tmp/omiro-ui02-error-recovery
- openLink: 'hakumi-dev://'
- waitForAnimationToEnd:
    timeout: 4000
- assertVisible:
    id: 'inbox-composer-input'

# Open a real message to expose its action row.
- tapOn:
    id: 'inbox-item-chat-open'
    index: 0
- waitForAnimationToEnd:
    timeout: 4000
- tapOn:
    text: 'SEND-02-OMIRO-NORMAL-SEND'
- waitForAnimationToEnd:
    timeout: 500

# UI-03: edit/delete controls are named and available on the user message.
- assertVisible: 'square.and.pencil'
- assertVisible: 'trash'
- tapOn: 'square.and.pencil'
- waitForAnimationToEnd:
    timeout: 1000
- assertVisible: 'Edit message'
- assertVisible: 'Save'
- takeScreenshot: /tmp/omiro-ui03-edit
- tapOn: 'Cancel'
- waitForAnimationToEnd:
    timeout: 500
- tapOn: 'trash'
- waitForAnimationToEnd:
    timeout: 500
- takeScreenshot: /tmp/omiro-ui03-delete-confirmation
- pressKey: Escape

# UI-04: copy/share/listen action labels are present where supported by the
# message modality. Copy exists for both roles; share and listen are assistant
# capabilities and may be absent for text-only replies.
- assertVisible: 'doc.on.doc'
- tapOn: 'doc.on.doc'
- takeScreenshot: /tmp/omiro-ui04-copy
- assertVisible: 'arrow.clockwise'
- takeScreenshot: /tmp/omiro-ui04-regenerate

# UI-05: smallest supported device is the booted iPhone 17 Pro simulator. Keep
# the composer and action row visible in the captured visual artifact.
- assertVisible:
    id: 'chat-composer-input'
- takeScreenshot: /tmp/omiro-ui05-smallest-supported-viewport

# UI-06: keyboard submission and accessible labels.
- tapOn:
    id: 'chat-composer-input'
- eraseText: 100
- inputText: 'UI-06-OMIRO-KEYBOARD'
- pressKey: ENTER
- waitForAnimationToEnd:
    timeout: 8000
- assertVisible: 'UI-06-OMIRO-KEYBOARD'
- assertVisible: 'Stop reply'
- takeScreenshot: /tmp/omiro-ui06-keyboard-accessibility
