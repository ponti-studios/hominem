appId: com.pontistudios.hakumi.dev
tags:
  - regression
---
# Omiro evidence: tool and confirmation states (TOOL-01 through
# TOOL-04). Tool names are stable accessibility labels supplied by the chat
# tool card.
#
# The new-chat composer is always empty (fresh screen), so no eraseText (up
# to 100 blind backspaces on iOS) is needed. The submit button sits in a
# KeyboardStickyView dock, so it stays visible and tappable with the keyboard
# open — no hideKeyboard needed either (Maestro's OS-level dismiss gesture is
# flaky on iOS simulator: "Couldn't hide the keyboard"). Post-submit waits are
# extendedWaitUntil on the expected content, so generation latency is covered
# and a stuck spinner fails instead of passing a settle-wait.

- runFlow: ../subflows/reset-to-home.yaml
- openLink: 'hakumi-dev:///new-chat'
- waitForAnimationToEnd:
    timeout: 4000
- assertVisible:
    id: 'new-chat-composer-input'
- tapOn:
    id: 'new-chat-composer-input'
- inputText: 'TOOL-01-OMIRO-TOOL-READY list my collections'
- assertVisible:
    id: 'new-chat-submit'
- tapOn:
    id: 'new-chat-submit'
- extendedWaitUntil:
    visible:
      id: 'chat-composer-input'
    timeout: 30000

# TOOL-01: successful tool call.
- assertVisible: 'list_collections'
- takeScreenshot: /tmp/omiro-tool01-tool-success

# TOOL-02 uses a fresh chat so its approval result cannot match an earlier
# assistant response or confirmation card.
- runFlow: ../subflows/reset-to-home.yaml
- openLink: 'hakumi-dev:///new-chat'
- waitForAnimationToEnd:
    timeout: 4000
- assertVisible:
    id: 'new-chat-composer-input'
- tapOn:
    id: 'new-chat-composer-input'
- inputText: 'TOOL-02-OMIRO-CONFIRM Create a private collection named Omiro TOOL-02.'
- tapOn:
    id: 'new-chat-submit'
- extendedWaitUntil:
    visible:
      id: 'chat-composer-input'
    timeout: 30000

# TOOL-02: confirmation-required tool, then approve.
- assertVisible: 'Approve create_collection'
- takeScreenshot: /tmp/omiro-tool02-confirmation-pending
- tapOn:
    id: 'tool-confirm-approve'
- extendedWaitUntil:
    visible: 'The collection was created successfully.'
    timeout: 30000
- assertNotVisible:
    id: 'tool-confirm-approve'
- takeScreenshot: /tmp/omiro-tool02-approved

# TOOL-03 also uses a fresh chat so the rejection targets exactly one pending
# confirmation.
- runFlow: ../subflows/reset-to-home.yaml
- openLink: 'hakumi-dev:///new-chat'
- waitForAnimationToEnd:
    timeout: 4000
- assertVisible:
    id: 'new-chat-composer-input'
- tapOn:
    id: 'new-chat-composer-input'
- inputText: 'SCRIPT:CONFIRM_REJECT Create a private collection named Omiro TOOL-03.'
- tapOn:
    id: 'new-chat-submit'
- extendedWaitUntil:
    visible:
      id: 'chat-composer-input'
    timeout: 30000

# TOOL-03: confirmation-required tool, then reject.
- assertVisible: 'Reject create_collection'
- takeScreenshot: /tmp/omiro-tool03-confirmation-pending
- tapOn:
    id: 'tool-confirm-reject'
- extendedWaitUntil:
    visible: 'The tool request was rejected.'
    timeout: 30000
- assertNotVisible:
    id: 'tool-confirm-reject'
- takeScreenshot: /tmp/omiro-tool03-rejected

# TOOL-04 uses a fresh chat for an isolated failed tool card.
- runFlow: ../subflows/reset-to-home.yaml
- openLink: 'hakumi-dev:///new-chat'
- waitForAnimationToEnd:
    timeout: 4000
- assertVisible:
    id: 'new-chat-composer-input'
- tapOn:
    id: 'new-chat-composer-input'
- inputText: 'SCRIPT:TOOL_FAIL'
- tapOn:
    id: 'new-chat-submit'

# TOOL-04: failed tool card remains visible. The scripted provider marks the
# malformed tool arguments with this marker; no success assertion is allowed.
# (Previously sent as `B009-OMIRO-TOOL-FAIL`, which never matched the
# testkit's `TOOL-B009-FAIL` trigger — this scenario silently never exercised
# the forced-failure path until this rename fixed the marker.)
- extendedWaitUntil:
    visible: 'SCRIPT:TOOL_FAIL'
    timeout: 30000
- takeScreenshot: /tmp/omiro-tool04-tool-failure
