engineStrict: true
pmOnFail: error
dedupePeerDependents: true
resolvePeersFromWorkspaceRoot: true
injectWorkspacePackages: true
verifyStoreIntegrity: true
strictStorePkgContentCheck: true
trustPolicy: needsFix
blockExoticSubdeps: true
strictDepBuilds: true
allowBuilds:
  '@openrouter/sdk': true
  '@sentry/cli': true
  '@shopify/react-native-skia': true
  '@swc/core': true
  core-js: false
  dtrace-provider: false
  esbuild: true
  msgpackr-extract: false
  msw: false
  protobufjs: false
  unrs-resolver: true
peerDependencyRules:
  allowedVersions:
    vite: '^8.0.0'
    '@opentelemetry/api': '1.9.1'
    valibot: '1.2.0 || ^1.3.0'
