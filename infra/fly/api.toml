app = "hominem-api"
primary_region = "sjc"

[env]
  PORT = "4040"
  NODE_ENV = "production"

[http_service]
  internal_port = 4040
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    method = "GET"
    path = "/"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
