app = "hominem-web"
primary_region = "sjc"

[env]
  PORT = "3000"
  NODE_ENV = "production"
  VITE_PUBLIC_API_URL = "https://api.ponti.io"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
