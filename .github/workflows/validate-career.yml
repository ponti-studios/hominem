name: validate-career

on:
  push:
    branches: [main]
    paths: &validation-paths
      - 'apps/career/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig*.json'
      - 'tsconfig.profiles/**'
      - 'just/**'
      - 'justfile'
      - 'scripts/**'
      - '.github/actions/setup-pnpm-workspace/**'
      - '.github/actions/setup-goose/**'
      - '.github/workflows/validate-career.yml'
      - '.github/workflows/_validate-app.yml'
  pull_request:
    branches: [main, preview]
    paths: *validation-paths

concurrency:
  group: validate-career-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  validate-career:
    uses: ./.github/workflows/_validate-app.yml
    with:
      package-filter: '@hominem/career'
      public-app-url: 'http://localhost:4451'

  docker-build:
    uses: ./.github/workflows/_validate-docker.yml
    with:
      dockerfile: apps/career/Dockerfile
      build-args: 'VITE_DATABASE_URL=postgresql://postgres:postgres@localhost:5432/hominem VITE_PUBLIC_API_URL=http://localhost:3000'
