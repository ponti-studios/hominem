name: _validate-app

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24.18.0'
      go-version:
        type: string
        default: '1.25'
      package-filter:
        description: Turbo package filter, for example @hominem/api
        type: string
        required: true
      mobile-export:
        description: Run the fixed iOS embed export check for Omiro.
        type: boolean
        default: false
      public-app-url:
        description: Public origin used by app validation.
        type: string
        default: 'http://localhost:3000'

permissions:
  contents: read
  packages: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TURBO_TELEMETRY_DISABLED: '1'
      NODE_ENV: test
      OPENROUTER_API_KEY: 'ci-test-openrouter-key'
      REDIS_URL: redis://localhost:6379
      RESEND_API_KEY: 'ci-test-resend-key'
      RESEND_FROM_EMAIL: 'test@example.com'
      RESEND_FROM_NAME: 'Test Sender'
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:4433/hominem-test
      BETTER_AUTH_SECRET: 'ci-test-better-auth-secret-32-characters'
      API_URL: http://localhost:4040
      HOMINEM_INTERNAL_API_URL: http://localhost:3000
      PUBLIC_APP_URL: ${{ inputs.public-app-url }}
      VITE_PUBLIC_API_URL: http://localhost:3000

    services:
      postgres:
        image: ghcr.io/ponti-studios/foundation/postgres@sha256:578d34f82b21752b9e749776e955fadc85e1cba8d962e78bce1bd60878a9c316
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hominem-test
        options: >-
          --health-cmd "pg_isready -U postgres -d hominem-test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 4433:5432
      redis:
        image: redis@sha256:52334768d4a6594d8969f51a1a6fee3ffa7545f6359a4877229cdc754d2def82
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: checkout-repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: setup-pnpm-workspace
        uses: ./.github/actions/setup-pnpm-workspace
        with:
          node-version: ${{ inputs.node-version }}

      - name: setup-go-for-migrations
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ inputs.go-version }}
          cache: false

      - name: run-database-migrations
        run: just db migrate test

      - name: validate
        run: |
          set -euo pipefail
          pnpm run check:dts
          pnpm format:check --filter=${{ inputs.package-filter }}...
          pnpm lint --filter=${{ inputs.package-filter }}...
          # build before typecheck: consumer typechecks resolve services/api's
          # emitted declarations, which only exist after its build runs (and
          # the api emit is not reachable via package.json dependency edges).
          pnpm build --filter=@hominem/api --filter=${{ inputs.package-filter }}...
          pnpm typecheck --filter=${{ inputs.package-filter }}...
          pnpm test --filter=${{ inputs.package-filter }}...

      - name: react-doctor
        if: inputs.package-filter == '@hominem/web'
        run: pnpm --filter @hominem/web run doctor

      - name: validate-mobile-embed
        if: inputs.mobile-export
        run: NODE_ENV=production pnpm --filter @hominem/omiro run export:embed:ios
