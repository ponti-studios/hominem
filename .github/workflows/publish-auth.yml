name: publish-auth

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish-auth:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - name: checkout-repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: setup-pnpm-workspace
        uses: ./.github/actions/setup-pnpm-workspace
        with:
          node-version: '24.18.0'

      - name: validate-auth-package
        run: |
          set -euo pipefail
          pnpm format:check --filter @ponti-studios/auth...
          pnpm lint --filter @ponti-studios/auth...
          pnpm typecheck --filter @ponti-studios/auth...
          pnpm test --filter @ponti-studios/auth...

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.18.0'
          registry-url: 'https://registry.npmjs.org'

      - name: use-npm-with-trusted-publishing-support
        run: npm install -g npm@11

      - name: publish-to-npm
        working-directory: packages/auth
        run: npm publish --provenance --access public
