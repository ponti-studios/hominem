name: publish-auth

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-auth:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - name: checkout-repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: setup-pnpm-workspace
        uses: ./.github/actions/setup-pnpm-workspace
        with:
          node-version: '24.18.0'

      - name: validate-auth-package
        run: |
          set -euo pipefail
          pnpm format:check --filter @ponti-studios/auth...
          pnpm lint --filter @ponti-studios/auth...
          pnpm typecheck --filter @ponti-studios/auth...
          pnpm test --filter @ponti-studios/auth...

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.18.0'

      # auth's home is GitHub Packages like the rest of the org scope —
      # consumers resolve @ponti-studios/* from npm.pkg.github.com.
      - name: publish-to-github-packages
        working-directory: packages/auth
        env:
          GH_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "//npm.pkg.github.com/:_authToken=${GH_PACKAGES_TOKEN}" >> ~/.npmrc
          version=$(node -p "require('./package.json').version")
          if npm view "@ponti-studios/auth@$version" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@ponti-studios/auth@$version is already on GitHub Packages, skipping."
          else
            npm publish --registry https://npm.pkg.github.com
          fi
