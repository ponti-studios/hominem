name: publish-auth

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-auth:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    steps:
      - name: checkout-repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: setup-pnpm-workspace
        uses: ./.github/actions/setup-pnpm-workspace
        with:
          node-version: '24.18.0'

      - name: validate-auth-package
        run: |
          set -euo pipefail
          pnpm format:check --filter @ponti-studios/auth...
          pnpm lint --filter @ponti-studios/auth...
          pnpm typecheck --filter @ponti-studios/auth...
          pnpm test --filter @ponti-studios/auth...

      # setup-node writes an npmrc line that reads NODE_AUTH_TOKEN; the token is
      # the workflow's GITHUB_TOKEN (a context, so it's passed in via env).
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24.18.0'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ponti-studios'

      - name: publish-to-github-packages
        working-directory: packages/auth
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: npm publish
