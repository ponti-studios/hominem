name: deploy-finance

# Disabled: the finance Fly app is intentionally not auto-deployed, so a merge to
# main must not bring it back. Re-enable by restoring the workflow_run trigger:
#
#   on:
#     workflow_run:
#       workflows: [validate-finance]
#       types: [completed]
#       branches: [main]
#     workflow_dispatch:
on:
  workflow_dispatch: {}

concurrency:
  group: deploy-finance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-finance:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    uses: ./.github/workflows/fly-deploy-service.yml
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    with:
      app: hominem-finance
      config_path: infra/fly/finance.toml
      dockerfile: apps/finance/Dockerfile
      build_args: |
        VITE_PUBLIC_API_URL=https://api.ponti.io
      checkout_ref: ${{ github.event.workflow_run.head_sha || github.sha }}
