name: deploy-web

on:
  workflow_run:
    workflows: [validate-web]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-web:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    uses: ./.github/workflows/fly-deploy-service.yml
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    with:
      app: hominem-web
      config_path: infra/fly/web.toml
      dockerfile: apps/web/Dockerfile
      build_args: |
        VITE_PUBLIC_API_URL=https://api.ponti.io
        VITE_POSTHOG_PROJECT_TOKEN=${{ vars.VITE_POSTHOG_PROJECT_TOKEN }}
      checkout_ref: ${{ github.event.workflow_run.head_sha || github.sha }}
