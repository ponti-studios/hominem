name: validate-db

on:
  push:
    branches: [main]
    paths: &db-paths
      - 'packages/db/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig*.json'
      - 'tsconfig.profiles/**'
      - 'just/**'
      - 'justfile'
      - 'scripts/**'
      - '.github/actions/setup-pnpm-workspace/**'
      - '.github/actions/setup-goose/**'
      - '.github/workflows/validate-db.yml'
  pull_request:
    branches: [main, preview]
    paths: *db-paths

concurrency:
  group: validate-db-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  db-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: ghcr.io/ponti-studios/foundation/postgres@sha256:578d34f82b21752b9e749776e955fadc85e1cba8d962e78bce1bd60878a9c316
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hominem-test
        options: >-
          --health-cmd "pg_isready -U postgres -d hominem-test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 4433:5432
    steps:
      - name: checkout-repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: setup-pnpm-workspace
        uses: ./.github/actions/setup-pnpm-workspace
        with:
          node-version: '24.18.0'

      - name: setup-goose
        uses: ./.github/actions/setup-goose
        with:
          go-version: '1.25'

      - name: lint-migrations
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="origin/$BASE_REF"
          else
            base="$BEFORE_SHA"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo 'No usable base ref; skipping changed-file migration lint.'
            exit 0
          fi
          just db lint --since "$base"

      - name: validate-migrations
        run: just db validate test

      - name: validate-generated-types
        run: |
          set -euo pipefail
          DATABASE_URL='postgresql://postgres:postgres@127.0.0.1:4433/hominem-test' just db codegen
          git diff --exit-code packages/db/src/types/database.ts
