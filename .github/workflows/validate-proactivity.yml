name: validate-proactivity

on:
  push:
    branches: [main]
    paths: &validation-paths
      - 'services/proactivity/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.dockerignore'
      - 'turbo.json'
      - 'tsconfig*.json'
      - 'tsconfig.profiles/**'
      - 'just/**'
      - 'justfile'
      - 'scripts/**'
      - '.github/actions/setup-pnpm-workspace/**'
      - '.github/actions/setup-goose/**'
      - '.github/workflows/validate-proactivity.yml'
      - '.github/workflows/_validate-app.yml'
  pull_request:
    branches: [main, preview]
    paths: *validation-paths

concurrency:
  group: validate-proactivity-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  validate-proactivity:
    uses: ./.github/workflows/_validate-app.yml
    with:
      package-filter: '@hominem/proactivity'
      public-app-url: 'http://localhost:4177'
