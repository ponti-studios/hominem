name: deploy-career

on:
  workflow_run:
    workflows: [validate-career]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-career
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-career:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    uses: ./.github/workflows/fly-deploy-service.yml
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    with:
      app: hominem-career
      config_path: infra/fly/career.toml
      dockerfile: apps/career/Dockerfile
      build_args: |
        VITE_PUBLIC_API_URL=https://api.ponti.io
      checkout_ref: ${{ github.event.workflow_run.head_sha || github.sha }}
