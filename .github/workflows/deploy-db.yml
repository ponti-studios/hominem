name: deploy-db-migrations

on:
  workflow_run:
    workflows: [validate-db]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-db-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-db-migrations:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    steps:
      - name: checkout-repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: setup-pnpm-workspace
        uses: ./.github/actions/setup-pnpm-workspace
        with:
          node-version: '24.18.0'

      - name: setup-goose
        uses: ./.github/actions/setup-goose
        with:
          go-version: '1.25'

      - name: apply-database-migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: just db migrate
