name: deploy-db-migrations

on:
  workflow_run:
    workflows: [validate-db]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-db-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-db-migrations:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Production
    steps:
      - name: checkout-repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: setup-pnpm-workspace
        uses: ./.github/actions/setup-pnpm-workspace
        with:
          node-version: '24.18.0'

      - name: setup-goose
        uses: ./.github/actions/setup-goose
        with:
          go-version: '1.25'

      - name: setup-flyctl
        uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      # hominem-db is private to Fly's network, so tunnel to it from the runner.
      - name: open-database-tunnel
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          flyctl proxy 15432:5432 -a hominem-db >/tmp/fly-proxy.log 2>&1 &
          for _ in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/15432) 2>/dev/null && exit 0
            sleep 1
          done
          cat /tmp/fly-proxy.log
          echo 'Database tunnel did not come up'
          exit 1

      - name: apply-database-migrations
        env:
          DATABASE_URL: postgresql://postgres:${{ secrets.FLY_POSTGRES_PASSWORD }}@localhost:15432/hominem
        run: just db migrate
