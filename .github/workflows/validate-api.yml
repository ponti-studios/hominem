name: validate-api

on:
  push:
    branches: [main]
    paths: &validation-paths
      - 'services/api/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.npmrc'
      - '.dockerignore'
      - 'turbo.json'
      - 'tsconfig*.json'
      - 'tsconfig.profiles/**'
      - 'just/**'
      - 'justfile'
      - 'scripts/**'
      - '.github/actions/setup-pnpm-workspace/**'
      - '.github/actions/setup-goose/**'
      - '.github/workflows/validate-api.yml'
      - '.github/workflows/_validate-app.yml'
  pull_request:
    branches: [main]
    paths: *validation-paths

concurrency:
  group: validate-api-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  validate-api:
    uses: ./.github/workflows/_validate-app.yml
    with:
      package-filter: '@hominem/api'

  docker-build:
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [services/api/Dockerfile, services/api/worker/Dockerfile]
    uses: ./.github/workflows/_validate-docker.yml
    with:
      dockerfile: ${{ matrix.dockerfile }}
