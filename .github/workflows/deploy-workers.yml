name: deploy-workers

on:
  workflow_run:
    workflows: [deploy-api]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-workers
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  require-api-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: verify-api-deployment
        run: |
          node --input-type=module <<'NODE'
          const response = await fetch(
            `https://api.github.com/repos/${process.env.REPOSITORY}/actions/workflows/deploy-api.yml/runs?head_sha=${process.env.TARGET_SHA}&per_page=100`,
            {
              headers: {
                Accept: 'application/vnd.github+json',
                Authorization: `Bearer ${process.env.GH_TOKEN}`,
                'X-GitHub-Api-Version': '2022-11-28',
              },
            },
          );
          if (!response.ok) throw new Error(`GitHub API ${response.status}: deploy-api runs`);
          const { workflow_runs: runs } = await response.json();
          const deployed = runs.some((run) =>
            run.head_branch === 'main' &&
            run.head_sha === process.env.TARGET_SHA &&
            run.status === 'completed' &&
            run.conclusion === 'success'
          );
          if (!deployed) throw new Error(`No successful API deployment for ${process.env.TARGET_SHA}`);
          console.log(`API deployment completed for ${process.env.TARGET_SHA}.`);
          NODE

  deploy-workers:
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    needs: require-api-deployment
    uses: ./.github/workflows/fly-deploy-service.yml
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    with:
      app: hominem-worker
      config_path: infra/fly/worker.toml
      dockerfile: services/api/worker/Dockerfile
      checkout_ref: ${{ github.event.workflow_run.head_sha || github.sha }}
