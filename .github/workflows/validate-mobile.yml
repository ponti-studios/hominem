name: validate-mobile

on:
  push:
    branches: [main]
    paths: &validation-paths
      - 'apps/omiro/**'
      - 'packages/**'
      - 'services/api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig*.json'
      - 'tsconfig.profiles/**'
      - 'just/**'
      - 'justfile'
      - 'scripts/**'
      - '.github/actions/setup-pnpm-workspace/**'
      - '.github/actions/setup-goose/**'
      - '.github/workflows/validate-mobile.yml'
      - '.github/workflows/_validate-app.yml'
  pull_request:
    branches: [main, preview]
    paths: *validation-paths

concurrency:
  group: validate-mobile-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  validate-mobile:
    uses: ./.github/workflows/_validate-app.yml
    with:
      package-filter: '@hominem/omiro'
      mobile-export: true
