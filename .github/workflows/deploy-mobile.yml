name: deploy-mobile

on:
  workflow_run:
    workflows: [validate-mobile]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-mobile
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  trigger-eas-release:
    if: ${{ github.ref == 'refs/heads/main' && github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: omiro-production
    steps:
      - name: checkout-repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: setup-pnpm-workspace
        uses: ./.github/actions/setup-pnpm-workspace
        with:
          node-version: '24.18.0'

      - name: install-eas-cli
        run: pnpm add --global eas-cli@21.2.0

      - name: trigger-production-release-workflow
        working-directory: apps/omiro
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_ENV: production
        run: pnpm exec eas workflow:run .eas/workflows/production-release.yml --non-interactive
