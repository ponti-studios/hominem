name: setup-pnpm-workspace
description: Set up the pinned Node.js and pnpm toolchain, install workspace dependencies, install just, and restore the Turbo cache.

inputs:
  node-version:
    description: Node.js version to install.
    required: true

runs:
  using: composite
  steps:
    - name: setup-pnpm
      uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
      with:
        runtime: node@${{ inputs.node-version }}
        cache: true
        cache-dependency-path: pnpm-lock.yaml

    - name: install-dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: setup-just
      uses: taiki-e/install-action@1b0ab3d2f6e68837936954afdea248a125d3b906 # just

    - name: setup-turbo-cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
