name: setup-pnpm-workspace
description: Set up the pinned Node.js and pnpm toolchain, install workspace dependencies, install just, and restore the Turbo cache.

inputs:
  node-version:
    description: Node.js version to install.
    required: true

runs:
  using: composite
  steps:
    - name: authenticate-github-packages
      shell: bash
      env:
        GH_PACKAGES_TOKEN: ${{ github.token }}
      run: |
        # The whole @ponti-studios scope (ui + rnkit) resolves from GitHub
        # Packages: rnkit's lockfile entry carries its tarball URL directly,
        # and the ui scope mapping points the rest of the scope at the same
        # host. ui moved off npmjs when the package registry migrated.
        echo "@ponti-studios:registry=https://npm.pkg.github.com" >> ~/.npmrc
        echo "//npm.pkg.github.com/:_authToken=${GH_PACKAGES_TOKEN}" >> ~/.npmrc

    - name: setup-pnpm
      uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
      with:
        runtime: node@${{ inputs.node-version }}
        cache: true
        cache-dependency-path: pnpm-lock.yaml

    - name: install-dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: setup-just
      uses: taiki-e/install-action@1b0ab3d2f6e68837936954afdea248a125d3b906 # just

    - name: setup-turbo-cache
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: .turbo/cache
        key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.ref_name }}-
